# Pipeline de integração contínua: build e testes a cada Pull Request e a cada integração na main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Back-end (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Testes unitários do domínio (Jest)
        run: npm test
      - name: Testes de API (Jest + Supertest)
        run: npm run test:e2e

  frontend:
    name: Front-end (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
