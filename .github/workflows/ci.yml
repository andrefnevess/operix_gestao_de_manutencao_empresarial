# Pipeline de integração contínua e entrega do Operix.
# - A cada Pull Request: build e testes do back-end, build do front-end e teste de fumaça
#   do ambiente completo (PostgreSQL + API + front-end) com Docker Compose.
# - A cada integração na main: tudo acima + publicação das imagens Docker no GitHub Container Registry.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execuções antigas da mesma branch quando chega um commit novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Testes unitários do domínio (Jest)
        run: npm test
      - name: Testes de API (Jest + Supertest)
        run: npm run test:e2e

  frontend:
    name: Front-end (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Sobe o ambiente completo como no desenvolvimento local e confere se a API
  # responde usando o PostgreSQL de verdade (PERSISTENCIA=prisma).
  ambiente:
    name: Ambiente completo (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_FILE: devops/docker/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Construir e subir PostgreSQL, API e front-end
        run: docker compose up -d --build
      - name: Aguardar a API (Swagger em /api/docs)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/docs > /dev/null; then
              echo "API no ar"; exit 0
            fi
            sleep 5
          done
          echo "A API não respondeu em 150 s"; exit 1
      - name: Conferir o front-end
        run: curl -fsS http://localhost:8080 > /dev/null
      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v

  # Só na main: publica as imagens no GitHub Container Registry (ghcr.io).
  imagens:
    name: Publicar imagens Docker
    runs-on: ubuntu-latest
    needs: [ambiente]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nome: operix-api
            contexto: backend
            dockerfile: devops/docker/Dockerfile.backend
          - nome: operix-web
            contexto: frontend
            dockerfile: devops/docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.nome }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.nome }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
